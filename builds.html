    .builds-page {

    .builds-page::after {

    .showcase {
    .showcase {

    .build-card {
  background: rgba(20, 20, 20, 0.72);

  border-radius: 18px;
  overflow: hidden;
  box-shadow: 0 18px 45px rgba(0, 0, 0, 0.45);
  backdrop-filter: blur(8px);

}

   .slider {
  position: relative;
  width: 100%;
  background: rgba(0, 0, 0, 0.35);
  overflow: hidden;
}

    .slider img {
  display: block;
  width: 100%;
  height: auto;
  max-height: 650px;
  object-fit: contain;
  margin: 0 auto;
  padding: 10px;
  box-sizing: border-box;
}

    .slider-button {
  position: absolute;
  top: 50%;
  transform: translateY(-50%);
  width: 48px;
  height: 48px;
  border: 1px solid rgba(255,255,255,0.25);
  border-radius: 50%;
  background: rgba(0,0,0,0.72);
  color: white;
  font-size: 25px;
  cursor: pointer;
  z-index: 3;
  backdrop-filter: blur(4px);
  -webkit-backdrop-filter: blur(4px);
}

    .slider-button.prev {
      left: 15px;
    }

    .slider-button.next {
      right: 15px;
    }

    .dots {
  display: flex;
  justify-content: center;
  gap: 8px;
  padding: 14px;
  background: rgba(0, 0, 0, 0.35);
}

    .dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      border: 0;
      background: #777;
      padding: 0;
      cursor: pointer;
    }

    .dot.active {
      background: white;
      transform: scale(1.25);
    }

    .build-info {
  padding: 32px;
  color: white;
  background: rgba(0, 0, 0, 0.18);
}

    .build-info h3 {
      margin-top: 0;
      font-size: 28px;
    }

    .build-story {
  line-height: 1.8;
  opacity: 0.92;
  font-size: 16px;
}

    .feature-list {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 12px 25px;
  margin-top: 28px;
  padding-left: 20px;
}

    .feature-list li {
      line-height: 1.5;
    }

    .work-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 20px;
    }

    .work-item {
      background: #111;
      border-radius: 16px;
      overflow: hidden;
      position: relative;
    }

    .work-item img {
      display: block;
      width: 100%;
      aspect-ratio: 4 / 3;
      object-fit: cover;
    }

    .work-item button {
      position: absolute;
      top: 12px;
      width: 38px;
      height: 38px;
      border: 0;
      border-radius: 50%;
      background: rgba(0,0,0,0.7);
      color: white;
      font-size: 20px;
      cursor: pointer;
    }

    .work-item .small-prev {
      left: 12px;
    }

    .work-item .small-next {
      right: 12px;
    }

    .work-dots {
      display: flex;
      justify-content: center;
      gap: 5px;
      padding: 10px;
    }

    .work-dot {
      width: 7px;
      height: 7px;
      border: 0;
      border-radius: 50%;
      background: #777;
      padding: 0;
    }

    .work-dot.active {
      background: white;
    }

    @media (max-width: 700px) {
      .showcase {
        padding: 30px 15px 60px;
      }

      }

      }

        padding: 22px;
      }

      .build-info h3 {
        font-size: 24px;
      }

      .slider-button {
        width: 40px;
        height: 40px;
      }

<section class="portfolio-showcase">

       <section class="portfolio-showcase">
  <div class="portfolio-heading">

  </div>

  <div class="portfolio-slider" id="portfolio-slider">

  <script src="builds-data.js"></script>

  <script>
    function createFeaturedBuild(build) {
      const section = document.createElement("section");
      section.className = "featured-build";

      section.innerHTML = `
        <div class="build-heading">
          <h2>${build.name}</h2>
        </div>

        <div class="build-card">

          <div class="slider" data-index="0">
            <img src="${build.images[0]}" alt="${build.name}">

            <button class="slider-button prev" aria-label="Previous image">
              &#10094;
            </button>

            <button class="slider-button next" aria-label="Next image">
              &#10095;
            </button>
          </div>

          <div class="dots"></div>

          <div class="build-info">
            <h3>${build.name}</h3>
            <p class="build-story">${build.story}</p>

            <ul class="feature-list">
              ${build.features.map(feature => `<li>${feature}</li>`).join("")}
            </ul>
          </div>

        </div>
      `;

      const slider = section.querySelector(".slider");
      const image = slider.querySelector("img");
      const dots = section.querySelector(".dots");

      let current = 0;
      let startX = 0;

      build.images.forEach((src, index) => {
        const dot = document.createElement("button");
        dot.className = "dot" + (index === 0 ? " active" : "");
        dot.setAttribute("aria-label", "View image " + (index + 1));

        dot.addEventListener("click", () => {
          current = index;
          update();
        });

        dots.appendChild(dot);
      });

      function update() {
        image.src = build.images[current];

        section.querySelectorAll(".dot").forEach((dot, index) => {
          dot.classList.toggle("active", index === current);
        });
      }

      section.querySelector(".prev").addEventListener("click", () => {
        current = (current - 1 + build.images.length) % build.images.length;
        update();
      });

      section.querySelector(".next").addEventListener("click", () => {
        current = (current + 1) % build.images.length;
        update();
      });

      slider.addEventListener("touchstart", event => {
        startX = event.touches[0].clientX;
      });

      slider.addEventListener("touchend", event => {
        const endX = event.changedTouches[0].clientX;
        const difference = startX - endX;

        if (Math.abs(difference) > 50) {
          if (difference > 0) {
            current = (current + 1) % build.images.length;
          } else {
            current = (current - 1 + build.images.length) % build.images.length;
          }

          update();
        }
      });

      return section;
    }

    function createWorkItem(build) {
      const item = document.createElement("div");
      item.className = "work-item";

      item.innerHTML = `
        <img src="${build.images[0]}" alt="Custom build">

        <button class="small-prev" aria-label="Previous image">
          &#10094;
        </button>

        <button class="small-next" aria-label="Next image">
          &#10095;
        </button>

        <div class="work-dots"></div>
      `;

      const image = item.querySelector("img");
      const dots = item.querySelector(".work-dots");

      let current = 0;
      let startX = 0;

      build.images.forEach((src, index) => {
        const dot = document.createElement("button");
        dot.className = "work-dot" + (index === 0 ? " active" : "");

        dot.addEventListener("click", () => {
          current = index;
          update();
        });

        dots.appendChild(dot);
      });

      function update() {
        image.src = build.images[current];

        item.querySelectorAll(".work-dot").forEach((dot, index) => {
          dot.classList.toggle("active", index === current);
        });
      }

      item.querySelector(".small-prev").addEventListener("click", () => {
        current = (current - 1 + build.images.length) % build.images.length;
        update();
      });

      item.querySelector(".small-next").addEventListener("click", () => {
        current = (current + 1) % build.images.length;
        update();
      });

      item.addEventListener("touchstart", event => {
        startX = event.touches[0].clientX;
      });

      item.addEventListener("touchend", event => {
        const endX = event.changedTouches[0].clientX;
        const difference = startX - endX;

        if (Math.abs(difference) > 50) {
          if (difference > 0) {
            current = (current + 1) % build.images.length;
          } else {
            current = (current - 1 + build.images.length) % build.images.length;
          }

          update();
        }
      });

      return item;
    }

    const featuredContainer = document.getElementById("featured-builds");
    const workGrid = document.getElementById("work-grid");

    builds.forEach(build => {
      if (!build.images || build.images.length === 0) {
        return;
      }

      if (build.featured) {
        featuredContainer.appendChild(createFeaturedBuild(build));
      } else {
        workGrid.appendChild(createWorkItem(build));
      }
    });
  </script>
<script>
  const portfolioImages = builds
    .filter(build => !build.featured && build.images && build.images.length)
    .flatMap(build => build.images);

  const portfolioImage = document.getElementById("portfolio-image");
  const portfolioDots = document.getElementById("portfolio-dots");
  const portfolioSlider = document.getElementById("portfolio-slider");

  let portfolioIndex = 0;
  let portfolioTimer;

  function showPortfolioImage(index) {
    if (!portfolioImages.length) return;

    portfolioIndex = (index + portfolioImages.length) % portfolioImages.length;
    portfolioImage.src = portfolioImages[portfolioIndex];

    portfolioDots.innerHTML = "";

    portfolioImages.forEach((src, i) => {
      const dot = document.createElement("button");

      dot.className =
        "portfolio-dot" + (i === portfolioIndex ? " active" : "");

      dot.setAttribute("aria-label", "View image " + (i + 1));

      dot.addEventListener("click", () => {
        showPortfolioImage(i);
        restartPortfolioTimer();
      });

      portfolioDots.appendChild(dot);
    });
  }

  function nextPortfolioImage() {
    showPortfolioImage(portfolioIndex + 1);
  }

  function previousPortfolioImage() {
    showPortfolioImage(portfolioIndex - 1);
  }

  function restartPortfolioTimer() {
    clearInterval(portfolioTimer);
    portfolioTimer = setInterval(nextPortfolioImage, 5000);
  }

  document.querySelector(".portfolio-next").addEventListener("click", () => {
    nextPortfolioImage();
    restartPortfolioTimer();
  });

  document.querySelector(".portfolio-prev").addEventListener("click", () => {
    previousPortfolioImage();
    restartPortfolioTimer();
  });

  let touchStartX = 0;

  portfolioSlider.addEventListener("touchstart", event => {
    touchStartX = event.changedTouches[0].screenX;
  });

  portfolioSlider.addEventListener("touchend", event => {
    const touchEndX = event.changedTouches[0].screenX;
    const difference = touchStartX - touchEndX;

    if (Math.abs(difference) > 50) {
      if (difference > 0) {
        nextPortfolioImage();
      } else {
        previousPortfolioImage();
      }

      restartPortfolioTimer();
    }
  });

  portfolioImage.addEventListener("click", () => {
    window.open(portfolioImage.src, "_blank");
  });

  showPortfolioImage(0);
  restartPortfolioTimer();
</script>
